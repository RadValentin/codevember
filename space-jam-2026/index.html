<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Jam Logo CSS Only 🐰🏀 - 2026</title>
  <link rel="stylesheet" href="fonts.css" type="text/css" />
  <link rel="stylesheet" href="styles.css" type="text/css" />
</head>
<body>
  <div class="background">
    <div class="stars stars-lg"></div>
    <div class="stars stars-md"></div>
    <div class="stars stars-sm"></div>
  </div>
  <div class="container">
    <h1 class="space-jam-logo">
      <span class="j-j j-back" data-text="J" aria-hidden="true">J</span>
      <div class="rings">
        <div class="ring-1"></div>
        <div class="ring-2"></div>
        <div class="ring-3"></div>
        <div class="ring-4"></div>
      </div>
      <span class="space">
        <span class="s-s" data-text="S">S</span>
        <span class="s-p" data-text="p">p</span>
        <span class="s-a" data-text="a">a</span>
        <span class="s-c" data-text="c">c</span>
        <span class="s-e" data-text="e">e</span>
      </span>
      <span class="j-j j-hook" data-text="J">J</span>
      <span class="j-a" data-text="a">a</span>
      <span class="j-m" data-text="m">m</span>
      <span class="j-j j-top" data-text="J" aria-hidden="true">J</span>
    </h1>
  </div>
</body>
</html>
